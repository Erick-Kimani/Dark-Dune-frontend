<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090909">
    <meta name="description" content="DarkDune — [add a short description of what the app does]">
    <meta property="og:title" content="DarkDune">
    <meta property="og:description" content="[add a short description]">
    <meta property="og:type" content="website">
    <title>DarkDune</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #090909;
        min-height: 100vh;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #090909;
      }
      #app-loader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="color:#fff; text-align:center; padding:2rem; font-family:sans-serif;">
        DarkDune requires JavaScript to run. Please enable it in your browser.
      </div>
    </noscript>
    <div id="app">
      <div id="app-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
